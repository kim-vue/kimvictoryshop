[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomconnect"
version = "0.3.0"
description = "A local, shared ZOOMBAR runtime for independent LENS worlds"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zoomconnect = "zoomconnect.cli:main"

[tool.setuptools.package-data]
zoomconnect = ["schema.sql", "web/*"]
